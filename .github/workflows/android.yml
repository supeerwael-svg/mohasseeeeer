name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies & Build web app
      run: |
        npm install
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: android/build.gradle

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Create missing cordova plugins directory & file
      run: |
        mkdir -p capacitor-cordova-android-plugins
        touch capacitor-cordova-android-plugins/cordova.variables.gradle
      working-directory: ./android

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Find all APK files in project
      run: find . -name "*.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-debug-apk
        path: |
          android/app/build/outputs/apk/**/*.apk
          **/build/outputs/apk/**/*.apk
          **/*.apk
