name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies & Build web app
      run: |
        npm install
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: android/build.gradle

    - name: Add and Sync Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Install Capacitor Assets & Generate Icons
      run: |
        npm install @capacitor/assets --save-dev
        npx @capacitor/assets generate --android
      working-directory: .

    - name: Fix AndroidManifest with Proper Launcher Configuration
      run: |
        mkdir -p app/src/main
        
        # كتابة ملف AndroidManifest.xml شاملاً لتعريف النشاط الرئيسي والأيقونة لكي يظهر التطبيق على شاشة الجوال
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">

                <activity
                    android:configChanges="keyboard|keyboardHidden|orientation|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                    android:name=".MainActivity"
                    android:exported="true"
                    android:label="@string/title_activity_main"
                    android:theme="@style/AppTheme.NoActionBar">
                    
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>

                </activity>
            </application>

        </manifest>
        EOF
      working-directory: ./android

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-final-launcher-v1
        path: android/app/build/outputs/apk/**/*.apk
