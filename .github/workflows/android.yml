
name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies & Build web app
      run: |
        npm install
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: android/build.gradle

    - name: Add and Sync Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Install Capacitor Assets & Generate Icons
      run: |
        npm install @capacitor/assets --save-dev
        npx @capacitor/assets generate --android
      working-directory: .

    - name: Ensure AndroidManifest exists
      run: |
        mkdir -p app/src/main
        if [ ! -f app/src/main/AndroidManifest.xml ]; then
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > app/src/main/AndroidManifest.xml
        fi
      working-directory: ./android

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-final-icon-apk-v2
        path: android/app/build/outputs/apk/**/*.apk
