name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies & Build web app
      run: |
        npm install
        npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: android/build.gradle

    - name: Add and Sync Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Fix Missing Manifest and Launcher Icons
      run: |
        mkdir -p app/src/main
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p capacitor-cordova-android-plugins
        touch capacitor-cordova-android-plugins/cordova.variables.gradle
        
        # إنشاء AndroidManifest.xml إن لم يكن موجوداً
        if [ ! -f app/src/main/AndroidManifest.xml ]; then
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > app/src/main/AndroidManifest.xml
        fi

        # إنشاء أيقونات افتراضية لتجنب خطأ الربط
        if [ ! -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml ]; then
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:color="#FFFFFF"/><foreground/></adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        fi
      working-directory: ./android

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./android

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: ./android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-app-debug-apk
        path: android/app/build/outputs/apk/**/*.apk
